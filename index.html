<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="apple-touch-icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>QuizFun</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QuizFun">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Holographic arcade: deep space ground, moving perspective grid, glass panels with category-tinted neon edges. Single dark look. */
:root{
  --void:#060918;
  --deep:#0d1330;
  --glass:rgba(22,30,66,.55);
  --glass-hi:rgba(40,54,110,.55);
  --edge:rgba(150,200,255,.18);
  --ink:#eaf1ff;
  --muted:#8c9cc6;
  --cyan:#3ef0ff;
  --pink:#ff3ecf;
  --gold:#ffd24a;
  --good:#3dffa0;
  --bad:#ff4d6a;
  --c:#3ef0ff;
  --f-display:"Oxanium",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
html,body{min-height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 15% 0%,rgba(255,62,207,.22),transparent 70%),radial-gradient(55% 45% at 100% 20%,rgba(62,240,255,.18),transparent 70%),linear-gradient(180deg,var(--void),var(--deep))}
.bg .stars{position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 12%,#cfe,transparent),radial-gradient(1.4px 1.4px at 85% 44%,#fff,transparent),radial-gradient(1px 1px at 40% 60%,#bdf,transparent),radial-gradient(1.2px 1.2px at 10% 80%,#fff,transparent),radial-gradient(1px 1px at 55% 25%,#fff,transparent),radial-gradient(1px 1px at 92% 75%,#fce,transparent);background-size:340px 340px;opacity:.7;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}
.bg .grid{position:absolute;left:-60%;right:-60%;bottom:-8%;height:48%;background-image:linear-gradient(rgba(62,240,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,62,207,.3) 1px,transparent 1px);background-size:46px 46px;transform:perspective(320px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000 20%,transparent);mask-image:linear-gradient(to top,#000 20%,transparent);animation:gm 2.6s linear infinite}
@keyframes gm{to{background-position:0 46px}}
.bg .sun{position:absolute;left:50%;bottom:30%;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:linear-gradient(180deg,var(--pink),#ff9a3e 60%,transparent 61%);opacity:.14;filter:blur(2px)}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-block:14px 32px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:22px;backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.04em;line-height:1;position:relative;background:linear-gradient(90deg,var(--cyan),#9b8cff 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(62,240,255,.35))}
.logo::after{content:"QUIZFUN";position:absolute;left:2px;top:0;color:var(--pink);opacity:0;-webkit-background-clip:initial;background:none;animation:glitch 5s infinite steps(1)}
@keyframes glitch{0%,92%,100%{opacity:0;transform:none}93%{opacity:.7;transform:translate(3px,-1px);clip-path:inset(10% 0 55% 0)}95%{opacity:.7;transform:translate(-3px,1px);clip-path:inset(60% 0 5% 0)}97%{opacity:0}}
.gems{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;padding:7px 12px 7px 9px;border-radius:999px;background:var(--glass);border:1px solid var(--edge)}
.gem{width:16px;height:16px;flex:none}

.hero{padding:14px;display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(62,240,255,.12),transparent 30%,rgba(255,62,207,.12),transparent 60%);animation:rot 14s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}
.hero>*{position:relative}
.avwrap{position:relative;aspect-ratio:1;max-width:100%}
.avwrap svg{width:100%;height:100%;display:block;overflow:visible}
.float{animation:fl 3.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.pad{position:absolute;left:12%;right:12%;bottom:-2px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(62,240,255,.55),transparent);filter:blur(1px)}
.hinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.pname{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05;overflow-wrap:anywhere}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
.tag.lv{color:var(--cyan);border-color:rgba(62,240,255,.4)}
.xpbar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.xpbar div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 12px var(--cyan);transition:width .7s cubic-bezier(.2,.9,.3,1.1)}
.xptxt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.neonbtn{border:0;border-radius:14px;padding:11px 14px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.05em;color:#061018;background:linear-gradient(90deg,var(--cyan),#8fb8ff);box-shadow:0 0 18px rgba(62,240,255,.45)}
.neonbtn.pink{background:linear-gradient(90deg,var(--pink),#ff8a5b);box-shadow:0 0 18px rgba(255,62,207,.45);color:#1a0414}
.neonbtn:active{transform:scale(.97)}

.sh{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:4px 2px -6px;display:flex;align-items:center;gap:10px}
.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{--c:#fff;position:relative;overflow:hidden;text-align:left;padding:14px;min-height:124px;display:flex;flex-direction:column;gap:10px;border-radius:20px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 26%,transparent),rgba(14,20,48,.7) 65%);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 8px 28px color-mix(in srgb,var(--c) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .15s}
.cat:active{transform:scale(.97)}
.cat::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.cat .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:rgba(0,0,0,.3);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.cat .ic svg{width:22px;height:22px;filter:drop-shadow(0 0 4px var(--c))}
.cat b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em;margin-top:auto}
.cat small{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.cat.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.cat.wide b{margin:0}.cat.wide small{margin-left:auto}
.st{color:var(--gold);letter-spacing:1px;text-shadow:0 0 6px rgba(255,210,74,.6)}
.st .o{color:rgba(255,255,255,.2);text-shadow:none}

/* customize */
.bar2{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--edge);background:var(--glass);display:grid;place-items:center;font-size:18px}
.bar2 h2{margin:0;flex:1;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em}
.studio{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
.studio .avwrap{width:min(220px,64vw)}
.studio::before{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(rgba(62,240,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(62,240,255,.18) 1px,transparent 1px);background-size:24px 24px;transform:perspective(200px) rotateX(55deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
.studio>*{position:relative}
.namein{width:100%;max-width:260px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:20px;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);background:rgba(0,0,0,.3)}
.srow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ghost{border:1px solid var(--edge);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 13px;font-weight:800;font-size:14px}
.slots{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.slot{flex:none;width:68px;height:68px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);padding:4px;position:relative}
.slot.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 16px rgba(62,240,255,.4)}
.slot svg{width:100%;height:100%}
.slot.add{display:grid;place-items:center;font-size:26px;color:var(--muted);border-style:dashed}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;margin-inline:-16px;padding-inline:16px;background:linear-gradient(var(--void) 70%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:9px 14px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.03em;white-space:nowrap}
.tab.on{background:linear-gradient(90deg,var(--cyan),var(--pink));color:#0a0a1a;border-color:transparent;box-shadow:0 0 16px rgba(255,62,207,.35)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{position:relative;border-radius:16px;border:1px solid var(--edge);background:var(--glass);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.item svg.pv{width:100%;aspect-ratio:1;height:auto}
.item span{font-size:12px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15}
.item.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(62,240,255,.35)}
.item.on span{color:var(--ink)}
.item .lock{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:3px;font-family:var(--f-display);font-size:11px;font-weight:800;padding:3px 6px;border-radius:8px;background:rgba(6,9,24,.85);border:1px solid var(--edge)}
.item .lock .gem{width:11px;height:11px}
.item.locked svg.pv{opacity:.45;filter:saturate(.4)}
.swatch{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid rgba(255,255,255,.15);box-shadow:inset 0 -8px 16px rgba(0,0,0,.25)}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.1)}
.dots i.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.dots i.no{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.dots i.now{background:var(--c);box-shadow:0 0 10px var(--c)}
.qmeta{display:flex;align-items:center;gap:10px}
.mini{width:54px;height:54px;flex:none;position:relative}
.mini svg{width:100%;height:100%;overflow:visible}
.mini.hop{animation:hop .5s}
.mini.sad{animation:sad .5s}
@keyframes hop{30%{transform:translateY(-12px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes sad{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bubble{position:absolute;left:52px;top:-6px;white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:13px;padding:4px 9px;border-radius:10px 10px 10px 2px;background:var(--ink);color:var(--void);opacity:0;transform:scale(.6);transform-origin:left bottom;transition:.2s}
.bubble.show{opacity:1;transform:scale(1)}
.streak{font-family:var(--f-display);font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
.streak.hot{background:linear-gradient(90deg,#ff8a3e,var(--pink));border-color:transparent;box-shadow:0 0 14px rgba(255,62,207,.45)}
.score{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(62,240,255,.5)}
.qcard{padding:20px 18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;position:relative;border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--c) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}
.qcat{font-family:var(--f-display);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.qtext{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,5.8vw,26px);line-height:1.25;text-wrap:balance}
.timer{position:relative;width:64px;height:64px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.timer.low b{color:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:58px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:800;font-size:17px;transition:transform .1s,background .2s,border-color .2s,opacity .2s,box-shadow .2s}
.ans:active:not(:disabled){transform:scale(.98);border-color:var(--c)}
.ans .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:rgba(0,0,0,.3)}
.ans:disabled{cursor:default}
.ans.right{background:rgba(61,255,160,.18);border-color:var(--good);box-shadow:0 0 22px rgba(61,255,160,.35)}
.ans.right .k{background:var(--good);color:#04160d;border-color:var(--good)}
.ans.wrong{background:rgba(255,77,106,.18);border-color:var(--bad);animation:sad .35s}
.ans.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.ans.gone{opacity:.2}
.lifes{display:flex;gap:10px}
.life{flex:1;padding:12px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em}
.life:disabled{opacity:.3;cursor:default}
.pop{position:absolute;top:-14px;right:14px;font-family:var(--f-display);font-weight:800;font-size:18px;padding:4px 10px;border-radius:10px;background:var(--good);color:#04160d;box-shadow:0 0 18px var(--good);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.pop.bad{background:var(--bad);color:#fff;box-shadow:0 0 18px var(--bad)}
.pop.show{transform:scale(1)}

/* result */
.res{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;position:relative;overflow:hidden}
.res .avwrap{width:150px}
.res h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1}
.bigstars{display:flex;gap:10px;margin-top:-4px}
.bigstars svg{width:48px;height:48px;transform:scale(0);animation:popin .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes popin{to{transform:scale(1)}}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.stat{padding:10px 4px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--edge);min-width:0}
.stat span{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.row .neonbtn,.row .ghost{padding:14px;font-size:16px}
.chip{font-family:var(--f-display);font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--pink));color:#0a0a1a}
.review{display:flex;flex-direction:column;gap:8px}
.rv{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--edge)}
.rv i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px}
.rv p{margin:0;min-width:0}
.rv p b{display:block}
.rv p span{color:var(--muted)}

/* party */
.party{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;border-radius:20px;border:1px solid rgba(255,62,207,.5);background:linear-gradient(120deg,rgba(255,62,207,.3),rgba(62,240,255,.16));box-shadow:0 0 30px rgba(255,62,207,.22),inset 0 1px 0 rgba(255,255,255,.1);position:relative;overflow:hidden}
.party:active{transform:scale(.98)}
.party::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
.faces{display:flex;flex:none}
.faces svg{width:46px;height:52px;margin-left:-16px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.faces svg:first-child{margin-left:0}
.ptxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ptxt b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.03em}
.ptxt small{font-size:13px;color:var(--muted);font-weight:700}
.party .go{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--pink)}
.plist{display:flex;flex-direction:column;gap:10px}
.pl{display:grid;grid-template-columns:60px 1fr 40px;gap:10px;align-items:center;padding:10px 12px}
.pl .av{width:60px;height:66px;border:0;background:none;padding:0;position:relative}
.pl .av svg{width:100%;height:100%;overflow:visible}
.pl .av::after{content:"↻";position:absolute;right:-2px;bottom:0;width:20px;height:20px;border-radius:50%;background:var(--cyan);color:#061018;font-size:12px;font-weight:800;display:grid;place-items:center}
.pl .fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.pl input,.pl select{width:100%;min-width:0;font-weight:800;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.3)}
.pl select{font-size:13px;color:var(--muted);font-weight:700;-webkit-appearance:none;appearance:none}
.pl .rm{width:40px;height:40px;border-radius:12px;border:1px solid var(--edge);background:transparent;color:var(--muted);font-size:16px}
.addp{border:1px dashed var(--edge);background:transparent;border-radius:18px;padding:14px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:9px 14px;font-family:var(--f-display);font-weight:700;font-size:14px}
.seg button.on{background:linear-gradient(90deg,var(--cyan),var(--pink));color:#0a0a1a;border-color:transparent}
.bigbtn{width:100%;padding:16px;font-size:18px}
.hand{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hand .avwrap{width:170px}
.hand .who{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.2em;color:var(--muted)}
.hand h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;overflow-wrap:anywhere}
.hand p{margin:0;color:var(--muted);font-size:14px}
.stand{display:flex;flex-direction:column;gap:6px}
.sr{display:grid;grid-template-columns:24px 40px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--edge)}
.sr.me{border-color:var(--cyan);box-shadow:0 0 12px rgba(62,240,255,.3)}
.sr i{font-style:normal;font-family:var(--f-display);font-weight:800;color:var(--muted)}
.sr svg{width:40px;height:44px}
.sr b{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr span{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.pbar{flex:1;display:flex;flex-direction:column;gap:4px}
.pbar small{font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.08em}
.pturn{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:15px;min-width:0}
.pturn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;width:100%;padding-top:10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod .pa{width:100%;max-width:110px}
.pod .pa svg{width:100%;height:auto;overflow:visible}
.pod b{font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod span{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--muted)}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:8px;font-family:var(--f-display);font-weight:800;font-size:28px;border:1px solid var(--edge);border-bottom:0}
.pod.p1 .blk{height:112px;background:linear-gradient(180deg,rgba(255,210,74,.5),rgba(255,210,74,.08));color:var(--gold);box-shadow:0 0 30px rgba(255,210,74,.3)}
.pod.p2 .blk{height:82px;background:linear-gradient(180deg,rgba(200,215,255,.35),rgba(200,215,255,.05))}
.pod.p3 .blk{height:60px;background:linear-gradient(180deg,rgba(255,138,62,.4),rgba(255,138,62,.05));color:#ffb27a}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;z-index:9;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:15px;padding:10px 16px;border-radius:14px;background:rgba(10,14,34,.92);border:1px solid var(--edge);box-shadow:0 0 24px rgba(62,240,255,.25);transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

/* avatar animations */
.av-spin{transform-origin:100px 100px;animation:rot 10s linear infinite}
.av-spin-r{transform-origin:100px 100px;animation:rot 16s linear infinite reverse}
.av-tw{animation:tw2 1.6s ease-in-out infinite alternate}
@keyframes tw2{from{opacity:.25}to{opacity:1}}
.av-fl{transform-origin:100px 210px;animation:flk .5s ease-in-out infinite alternate}
@keyframes flk{to{transform:scaleY(1.06) scaleX(.97)}}
.av-bob{animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.av-pulse{animation:tw2 1s ease-in-out infinite alternate}
.av-scan{animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bigstars svg{transform:none}}
</style>

let SCREEN='home',ROOM,RM=null,ON=null,unPeers=null;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function guest(seed){const r=rng(seed*7919+13),c=Object.assign({},FIRST);TABS.forEach(t=>{const l=ITEMS[t].list.filter(it=>!it.cost&&!it.lvl);c[t]=l[Math.floor(r()*l.length)].id});c.base=['robot','human'][seed%2];c.aura='none';c.pet='none';return c}
function packAv(c){const o={};TABS.forEach(t=>o[t]=c[t]);return o}
function cleanAv(o){const c=Object.assign({},FIRST);if(o&&typeof o==='object')TABS.forEach(t=>{if(ITEMS[t].list.some(it=>it.id===o[t]))c[t]=o[t]});return c}
function cleanName(s){return typeof s==='string'&&s.trim()?s.replace(/[\u0000-\u001f​-‏‪-‮]/g,'').slice(0,16):'Spelare'}
async function getRoom(){if(ROOM!==undefined)return ROOM;
  if(window.claude&&window.claude.use){try{ROOM=await window.claude.use('room')}catch(e){ROOM=null}if(ROOM)return ROOM}
  if(!window.Peer)await new Promise(r=>{let n=0;const t=setInterval(()=>{if(window.Peer||++n>40){clearInterval(t);r()}},100)});
  ROOM=window.Peer?{join:(name,host)=>makeNet(name,host)}:null;return ROOM}
function makeNet(name,host){return new Promise((resolve,reject)=>{
  const HID='quizfun-dz-'+name,me={},others={},conns={},subs=[],errCb=[];
  const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}];
  let peer,myId=null,hostConn=null,done=false,closed=false,ntf=0,tries=0,retryT=0,beat=0;
  const notify=()=>{if(ntf)return;ntf=requestAnimationFrame(()=>{ntf=0;subs.forEach(f=>{try{f()}catch(e){}})})};
  const fail=m=>{if(closed)return;closed=true;cleanup();errCb.forEach(f=>{try{f({code:'upstream_error',message:m})}catch(e){}})};
  const everyone=()=>Object.assign({[myId]:me},others);
  const broadcast=()=>{const list=everyone();Object.values(conns).forEach(c=>{if(c.open)try{c.send({t:'all',list})}catch(e){}})};
  const sendMe=()=>{if(hostConn&&hostConn.open)try{hostConn.send({t:'p',p:me})}catch(e){}};
  const revive=()=>{try{if(peer&&!peer.destroyed&&peer.disconnected)peer.reconnect()}catch(e){}};
  function cleanup(){clearTimeout(retryT);clearInterval(beat);document.removeEventListener('visibilitychange',onVis);try{peer&&peer.destroy()}catch(e){}}
  function onVis(){if(document.hidden||closed)return;revive();if(!host&&(!hostConn||!hostConn.open))retry(true)}
  function connectHost(){
    if(closed)return;
    try{hostConn&&hostConn.close()}catch(e){}
    const c=peer.connect(HID,{reliable:true});hostConn=c;
    const t=setTimeout(()=>{if(!c.open&&hostConn===c&&done)retry()},7000);
    c.on('open',()=>{clearTimeout(t);if(hostConn!==c)return;tries=0;sendMe();if(!done){done=true;clearTimeout(to);resolve(api)}else toast('Ansluten igen')});
    c.on('data',d=>{if(d&&d.t==='all'&&d.list&&typeof d.list==='object'){for(const k in others)delete others[k];for(const [k,v] of Object.entries(d.list))if(k!==myId&&v&&typeof v==='object')others[k]=v;notify()}});
    c.on('close',()=>{if(hostConn===c&&done&&!closed)retry()});
    c.on('error',()=>{if(hostConn===c&&done&&!closed)retry()});
  }
  function retry(now){
    if(closed)return;clearTimeout(retryT);
    if(++tries>15){fail('host_left');return}
    if(tries===1)toast('Återansluter…');
    retryT=setTimeout(()=>{revive();connectHost()},now?300:2000);
  }
  const api={presence(patch){for(const k in patch){if(patch[k]===null)delete me[k];else me[k]=patch[k]}if(host)broadcast();else sendMe();notify();return Promise.resolve()},
    peers(){return[{peer:myId,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:me},...Object.entries(others).map(([id,p])=>({peer:id,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:p}))]},
    onPeers(fn,onErr){subs.push(fn);if(onErr)errCb.push(onErr);setTimeout(fn,0);return()=>{const i=subs.indexOf(fn);if(i>=0)subs.splice(i,1)}},
    leave(){closed=true;cleanup();return Promise.resolve()}};
  const to=setTimeout(()=>{if(!done){closed=true;cleanup();reject({code:'timeout'})}},15000);
  peer=new Peer(host?HID:undefined,{debug:0,config:{iceServers:ICE}});
  peer.on('error',e=>{if(!done){if(!host&&e.type==='peer-unavailable'||e.type==='unavailable-id'||e.type==='browser-incompatible'){done=true;closed=true;clearTimeout(to);cleanup();reject({code:e.type})}}else if(!host&&e.type==='peer-unavailable')retry()});
  peer.on('disconnected',()=>{if(!closed)setTimeout(revive,1000)});
  peer.on('open',id=>{myId=id;
    if(host){done=true;clearTimeout(to);
      peer.on('connection',c=>{
        c.on('open',()=>{conns[c.peer]=c;broadcast()});
        c.on('data',d=>{if(d&&d.t==='p'&&d.p&&typeof d.p==='object'&&JSON.stringify(d.p).length<4096){conns[c.peer]=c;others[c.peer]=d.p;broadcast();notify()}});
        c.on('close',()=>{if(conns[c.peer]===c){delete conns[c.peer];setTimeout(()=>{if(!conns[c.peer]){delete others[c.peer];broadcast();notify()}},8000)}});
      });
      beat=setInterval(broadcast,4000);
      resolve(api);
    }else{beat=setInterval(sendMe,4000);connectHost()}
  });
  document.addEventListener('visibilitychange',onVis);
})}
const people=()=>RM?RM.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.nm):[];
const hostOf=()=>people().find(p=>p.presence.host===true&&!p.isMe)||people().find(p=>p.presence.host===true);
const inGame=()=>people().filter(p=>ON&&p.presence.gid===ON.gid);

async function onlineMenu(){
  SCREEN='menu';
  app.innerHTML=`
  <div class="bar2"><button class="iconbtn" id="back" aria-label="Tillbaka">‹</button><h2>ONLINE</h2></div>
  <section class="glass hand">
    <div class="faces" style="justify-content:center">${[me(),guest(1),guest(2)].map(c=>avatar(Object.assign({},c,{aura:'none',pet:'none'}))).join('')}</div>
    <h2>Duell med vänner</h2>
    <p>Skapa ett rum och skicka koden till en kompis. Ni får samma frågor och ser varandras poäng live.</p>
    <div id="roomState" class="xptxt">Ansluter…</div>
  </section>
  <button class="neonbtn bigbtn" id="create" disabled>SKAPA RUM</button>
  <div class="sh">Har du en kod?</div>
  <section class="glass" style="padding:14px;display:flex;gap:10px">
    <input class="namein" id="code" maxlength="4" placeholder="KOD" autocomplete="off" autocapitalize="characters" style="flex:1;max-width:none;letter-spacing:.3em;text-transform:uppercase" aria-label="Rumskod">
    <button class="neonbtn pink" id="joinB" disabled>GÅ MED</button>
  </section>`;
  document.getElementById('back').onclick=home;
  const room=await getRoom();
  const st=document.getElementById('roomState');if(!st)return;
  if(!room){st.textContent='Kunde inte starta online. Kolla att du har internet och ladda om sidan.';st.style.color='var(--bad)';return}
  st.textContent='Redo att spela';st.style.color='var(--good)';
  const cb=document.getElementById('create'),jb=document.getElementById('joinB'),ci=document.getElementById('code');
  cb.disabled=false;jb.disabled=false;
  cb.onclick=()=>{const L='abcdefghjkmnpqrstuvwxyz';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];enterRoom(c,true)};
  jb.onclick=()=>{const c=ci.value.trim().toLowerCase();if(!/^[a-z]{4}$/.test(c)){toast('Koden är 4 bokstäver');return}enterRoom(c,false)};
  ci.onkeydown=e=>{if(e.key==='Enter')jb.click()};
}
async function enterRoom(code,host){
  const room=await getRoom();if(!room)return;
  toast('Ansluter…');
  try{RM=await room.join('qf-'+code,host)}catch(e){RM=null;toast(e&&e.code==='peer-unavailable'?'Hittade inget rum med den koden':e&&e.code==='unavailable-id'?'Koden är upptagen, försök igen':'Kunde inte ansluta, försök igen');return}
  ON={code,host,gid:null,cat:'mix'};
  RM.presence({nm:cleanName(me().name),av:packAv(me()),host,st:'lobby',gid:null,qi:0,sc:0,c:0,game:null}).catch(()=>{});
  unPeers=RM.onPeers(onlineTick,()=>{toast('Tappade kontakten med värden');leaveOnline()});
  tone(880,.1);lobby();
}
function leaveOnline(){if(ON)clearTimeout(ON.goneT);try{unPeers&&unPeers()}catch(e){}try{RM&&RM.leave()}catch(e){}RM=null;ON=null;unPeers=null;home()}

function row(p,i,extra){const pr=p.presence;return`<div class="sr ${p.isMe&&p.sameTab?'me':''}"><i>${i}</i>${avatar(Object.assign(cleanAv(pr.av),{aura:'none',pet:'none',name:cleanName(pr.nm)}))}<b>${esc(cleanName(pr.nm))}${pr.host?' <span class="st">♛</span>':''}${p.isMe&&p.sameTab?' (du)':''}</b><span>${extra}</span></div>`}

function lobby(){
  SCREEN='lobby';
  const cats=[['mix',MIX],...Object.entries(Q)];
  app.innerHTML=`
  <div class="bar2"><button class="iconbtn" id="back" aria-label="Lämna rummet">‹</button><h2>RUM</h2></div>
  <section class="glass hand">
    <div class="who">RUMSKOD</div>
    <h2 style="font-size:52px;letter-spacing:.25em;margin-right:-.25em;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent">${ON.code.toUpperCase()}</h2>
    <p>Kompisen öppnar QuizFun, trycker <b>Spela online</b> och skriver in koden.</p>
    <button class="ghost" id="copy">Kopiera kod</button>
  </section>
  <div class="sh">Spelare</div>
  <div class="stand" id="lobbyList"></div>
  ${ON.host?`<div class="sh">Kategori</div><div class="seg" id="catSeg">${cats.map(([k,c])=>`<button data-k="${k}" class="${k===ON.cat?'on':''}">${c.n}</button>`).join('')}</div>
  <button class="neonbtn bigbtn" id="startB">STARTA MATCH</button>`:`<p class="hint xptxt" style="text-align:center" id="waitTxt">Väntar på att värden startar…</p>`}`;
  document.getElementById('back').onclick=leaveOnline;
  document.getElementById('copy').onclick=async e=>{try{await navigator.clipboard.writeText(ON.code.toUpperCase());e.target.textContent='Kopierad!'}catch(_){e.target.textContent=ON.code.toUpperCase()}};
  if(ON.host){
    document.getElementById('catSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;ON.cat=b.dataset.k;document.querySelectorAll('#catSeg button').forEach(x=>x.classList.toggle('on',x===b));tone(600,.05)};
    document.getElementById('startB').onclick=()=>{
      if(people().length<2){toast('Vänta tills någon har gått med');return}
      const game={gid:Date.now().toString(36),seed:Math.floor(Math.random()*1e9),cat:ON.cat};
      RM.presence({game}).catch(()=>{});startOnline(game)};
  }
  renderLobby();
}
function renderLobby(){const el=document.getElementById('lobbyList');if(!el)return;const ps=people();el.innerHTML=ps.map((p,i)=>row(p,i+1,p.presence.st==='play'?'spelar':'redo')).join('')||'<p class="xptxt">Ansluter…</p>'}

function buildList(game){
  const r=rng(game.seed);
  const all=game.cat==='mix'||!Q[game.cat]?Object.entries(Q).flatMap(([ck,c])=>c.q.map(q=>({q,ck}))):Q[game.cat].q.map(q=>({q,ck:game.cat}));
  return sshuffle(all,r).slice(0,10).map(({q,ck})=>({t:q[0],a:q[1],opts:sshuffle([q[1],...q[2]],r),ck}));
}
function startOnline(game){
  if(!game||typeof game.gid!=='string'||!Number.isFinite(game.seed))return;
  ON.gid=game.gid;
  const k=game.cat==='mix'||!Q[game.cat]?'mix':game.cat;
  G={k,cat:k==='mix'?MIX:Q[k],list:buildList(game),i:0,score:0,streak:0,maxStreak:0,res:[],fifty:true,skip:false,online:true};
  RM.presence({st:'play',gid:game.gid,qi:0,sc:0,c:0}).catch(()=>{});
  toast('Matchen börjar!');[523,784].forEach((f,i)=>tone(f,.15,'triangle',.13,i*.12));
  question();
}
function renderOpp(){
  const el=document.getElementById('opp');if(!el)return;
  const ps=inGame().filter(p=>!(p.isMe&&p.sameTab)).sort((a,b)=>(b.presence.sc||0)-(a.presence.sc||0));
  el.innerHTML=ps.length?ps.map((p,i)=>row(p,i+1,`${(+p.presence.sc||0)} p · ${Math.min(10,+p.presence.qi||0)}/10${p.presence.st==='done'?' ✓':''}`)).join(''):'<p class="xptxt">Ingen annan i matchen just nu</p>';
}
function onlineDone(){
  const correct=G.res.filter(r=>r.ok).length,xp=correct*20+Math.round(G.score/20)+G.maxStreak*5,gems=correct*3+10;
  save.xp+=xp;save.gems+=gems;save.played++;persist();
  ON.reward={xp,gems,correct};
  RM&&RM.presence({st:'done',qi:10,sc:G.score,c:correct}).catch(()=>{});
  SCREEN='wait';renderWait();
}
function renderWait(){
  const ps=inGame().sort((a,b)=>(+b.presence.sc||0)-(+a.presence.sc||0));
  const allDone=ps.length>0&&ps.every(p=>p.presence.st==='done');
  if(allDone){podium(ps);return}
  app.innerHTML=`
  <div class="bar2"><button class="iconbtn" id="back" aria-label="Lämna">‹</button><h2>KLAR!</h2></div>
  <section class="glass hand"><div class="avwrap"><div class="float">${avatar(me())}</div><div class="pad"></div></div>
    <h2>${G.score} p</h2><p>Väntar på att alla ska bli klara…</p></section>
  <div class="sh">Ställning</div>
  <div class="stand">${ps.map((p,i)=>row(p,i+1,`${+p.presence.sc||0} p · ${Math.min(10,+p.presence.qi||0)}/10${p.presence.st==='done'?' ✓':''}`)).join('')}</div>`;
  document.getElementById('back').onclick=leaveOnline;
}
function podium(ps){
  if(SCREEN!=='podium'){SCREEN='podium';const win=ps[0]&&ps[0].isMe&&ps[0].sameTab;if(win){confetti();[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.13,i*.1))}else tone(440,.25)}
  const order=[1,0,2].filter(i=>ps[i]);
  const winnerAv=p=>{const c=Object.assign(cleanAv(p.presence.av),{name:cleanName(p.presence.nm)});if(c.hair!=='helmet'&&c.hair!=='halo')c.hair='crown';return c};
  const me1=ps.findIndex(p=>p.isMe&&p.sameTab);
  app.innerHTML=`
  <div class="bar2"><button class="iconbtn" id="back" aria-label="Lämna">‹</button><h2>RESULTAT</h2></div>
  <section class="glass res">
    <h2>${me1===0?'DU VANN!':ps[0]?esc(cleanName(ps[0].presence.nm))+' vann!':'Match klar'}</h2>
    <div class="podium">${order.map(i=>{const p=ps[i];return`<div class="pod p${i+1}"><div class="pa">${avatar(i===0?winnerAv(p):Object.assign(cleanAv(p.presence.av),{name:cleanName(p.presence.nm)}))}</div><b>${esc(cleanName(p.presence.nm))}</b><span>${+p.presence.sc||0} p · ${+p.presence.c||0}/10</span><div class="blk">${i+1}</div></div>`}).join('')}</div>
    ${ON.reward?`<div class="grid4" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><span>Placering</span><b>${me1+1}</b></div><div class="stat"><span>XP</span><b style="color:var(--good)">+${ON.reward.xp}</b></div><div class="stat"><span>Kristaller</span><b style="color:var(--cyan)">+${ON.reward.gems}</b></div></div>`:''}
    ${ps.length>3?`<div class="stand" style="width:100%">${ps.slice(3).map((p,i)=>row(p,i+4,(+p.presence.sc||0)+' p')).join('')}</div>`:''}
    ${ON.host?'<button class="neonbtn bigbtn" id="again">NY MATCH</button>':'<p class="xptxt">Värden kan starta en ny match</p>'}
    <button class="ghost" id="leave" style="width:100%">Lämna rummet</button>
  </section>`;
  document.getElementById('back').onclick=leaveOnline;
  document.getElementById('leave').onclick=leaveOnline;
  if(ON.host)document.getElementById('again').onclick=()=>{RM.presence({st:'lobby',gid:null,game:null}).catch(()=>{});ON.gid=null;ON.reward=null;lobby()};
}
function onlineTick(){
  if(!RM||!ON)return;
  const h=hostOf(),g=h&&h.presence.game;
  if(!ON.host){
    if(h){ON.sawHost=true;clearTimeout(ON.goneT);ON.goneT=0}
    else if(ON.sawHost&&!ON.goneT&&(SCREEN==='lobby'||SCREEN==='podium'))ON.goneT=setTimeout(()=>{if(ON&&!hostOf()){toast('Värden lämnade rummet');leaveOnline()}},12000);
  }
  if(!ON.host&&g&&g.gid&&g.gid!==ON.gid&&(SCREEN==='lobby'||SCREEN==='podium')){ON.reward=null;startOnline(g);return}
  if(SCREEN==='lobby')renderLobby();
  else if(SCREEN==='play')renderOpp();
  else if(SCREEN==='wait')renderWait();
}

const cc=document.getElementById('confetti'),cx=cc.getContext('2d');
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const d=Math.min(devicePixelRatio||1,2);cc.width=innerWidth*d;cc.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);
  const cols=['#3ef0ff','#ff3ecf','#ffd24a','#3dffa0','#b98cff'];
  let ps=Array.from({length:130},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.3,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],s:5+Math.random()*6}));
  (function f(){cx.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.shadowColor=p.c;cx.shadowBlur=8;cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
    ps=ps.filter(p=>p.y<innerHeight+20);if(ps.length)requestAnimationFrame(f);else cx.clearRect(0,0,innerWidth,innerHeight)})();
}
home();
</script>
